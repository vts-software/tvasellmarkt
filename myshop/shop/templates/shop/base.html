{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}TvaSellMarkt{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
  <header class="nav-container">
    <div class="nav-left"><a href="{% url 'shop:index' %}">Главная</a></div>
    <div class="nav-center"><h1>TvaSellMarkt</h1></div>
    <div class="nav-right">
      {% if user.is_authenticated %}
        <a href="{% url 'shop:cart_detail' %}">Корзина</a>
        <a href="{% url 'shop:logout' %}">Выйти</a>
      {% else %}
        <a href="{% url 'shop:login' %}">Войти</a>
      {% endif %}
    </div>
  </header>

  {% block content %}{% endblock %}

  <footer class="footer-container">
    <div class="footer-left">© 2025 TvaSellMarkt</div>
    <div class="footer-center">Сделано с любовью</div>
    <div class="footer-right"><a href="{% url 'shop:index' %}">Каталог</a></div>
  </footer>
</body>
</html>
